<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Tracker</title>
<meta name="theme-color" content="#1a0f3c">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg1: #1a0f3c; --bg2: #3b1a5a;
    --card: rgba(255,255,255,.06); --border: rgba(255,255,255,.12);
    --text: #f1ecff; --muted: #b3a6d9;
    --green: #4ade80; --red: #f87171; --amber: #facc15; --accent: #7c5cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 1.5rem; margin: 0; }
  .row { display: flex; gap: 8px; align-items: center; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 1rem; font-weight: 500; color: var(--muted); }
  select, input, button { font: inherit; color: var(--text); }
  select, input {
    background: rgba(0,0,0,.25); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; width: 100%; min-width: 0;
  }
  input::placeholder { color: rgba(179,166,217,.6); }
  button { cursor: pointer; border: 1px solid var(--border); background: rgba(0,0,0,.25); border-radius: 12px; padding: 12px 14px; }
  .icon-btn { font-size: 1.2rem; line-height: 1; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .summary small { display: block; color: var(--muted); margin-bottom: 4px; }
  .summary strong { font-size: 1.3rem; }
  .inc { color: var(--green); } .exp { color: var(--red); }
  .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin: 12px 0 8px; }
  .bar > div { height: 100%; width: 0; border-radius: 99px; background: var(--green); transition: width .3s, background .3s; }
  .hint { color: var(--muted); font-size: .9rem; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .primary { width: 100%; background: var(--accent); border: 0; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  li:last-child { border-bottom: 0; }
  li .meta { min-width: 0; }
  li .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .meta span { color: var(--muted); font-size: .85rem; }
  li .amt { font-weight: 600; white-space: nowrap; }
  li .del { padding: 6px 10px; margin-left: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 12px 0; }
  #settings { display: none; }
  #settings.open { display: block; }
  .settings-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .danger { color: var(--red); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>💰 Budget Tracker</h1>
    <div class="row">
      <select id="month" aria-label="Month"></select>
      <button class="icon-btn" id="gear" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <section class="card" id="settings">
    <h2>Settings</h2>
    <input id="currency" placeholder="Currency symbol (optional, e.g. Rs, $, €)" maxlength="4">
    <div class="settings-actions">
      <button id="export">Export data (JSON)</button>
      <button id="clear" class="danger">Delete all data</button>
    </div>
  </section>

  <section class="card summary">
    <div><small>Income</small><strong class="inc" id="sInc">0</strong></div>
    <div><small>Spent</small><strong class="exp" id="sExp">0</strong></div>
    <div><small>Balance</small><strong id="sBal">0</strong></div>
  </section>

  <section class="card">
    <h2>Monthly spending limit</h2>
    <input id="limit" type="number" inputmode="decimal" min="0" placeholder="0">
    <div class="bar"><div id="bar"></div></div>
    <div class="hint" id="limitText">Set a limit to track your spending.</div>
  </section>

  <section class="card">
    <h2>Add transaction</h2>
    <div class="seg">
      <button id="tExp" class="on" type="button">Expense</button>
      <button id="tInc" type="button">Income</button>
    </div>
    <div class="grid2">
      <input id="amount" type="number" inputmode="decimal" min="0" step="any" placeholder="Amount">
      <input id="date" type="date">
    </div>
    <div class="grid2">
      <select id="cat"></select>
      <input id="note" placeholder="Note (optional)" maxlength="60">
    </div>
    <button class="primary" id="add" type="button">Add</button>
  </section>

  <section class="card">
    <h2>Transactions</h2>
    <ul id="list"></ul>
  </section>

</div>

<script>
(function () {
  var KEY = 'budgetTracker.v1';
  var EXP_CATS = ['Food', 'Transport', 'Bills', 'Shopping', 'Health', 'Entertainment', 'Other'];
  var INC_CATS = ['Salary', 'Business', 'Gift', 'Other'];
  var state = { tx: [], limit: 0, currency: '' };
  var type = 'expense';
  var $ = function (id) { return document.getElementById(id); };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var s = JSON.parse(raw); state.tx = s.tx || []; state.limit = s.limit || 0; state.currency = s.currency || ''; }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmt(n) {
    var s = Math.round(n).toLocaleString('en-US');
    return state.currency ? state.currency + ' ' + s : s;
  }
  function monthLabel(ym) {
    var p = ym.split('-');
    return new Date(+p[0], +p[1] - 1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function buildMonths() {
    var sel = $('month'), cur = sel.value || todayStr().slice(0, 7);
    var set = {}, now = new Date();
    for (var i = -12; i <= 3; i++) {
      var d = new Date(now.getFullYear(), now.getMonth() + i, 1);
      set[d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')] = 1;
    }
    state.tx.forEach(function (t) { set[t.date.slice(0, 7)] = 1; });
    var keys = Object.keys(set).sort();
    sel.innerHTML = keys.map(function (k) { return '<option value="' + k + '">' + monthLabel(k) + '</option>'; }).join('');
    sel.value = set[cur] ? cur : todayStr().slice(0, 7);
  }

  function buildCats() {
    var cats = type === 'expense' ? EXP_CATS : INC_CATS;
    $('cat').innerHTML = cats.map(function (c) { return '<option>' + c + '</option>'; }).join('');
  }

  function render() {
    var ym = $('month').value;
    var items = state.tx.filter(function (t) { return t.date.slice(0, 7) === ym; })
      .sort(function (a, b) { return b.date.localeCompare(a.date) || b.id - a.id; });
    var inc = 0, exp = 0;
    items.forEach(function (t) { if (t.type === 'income') inc += t.amount; else exp += t.amount; });

    $('sInc').textContent = fmt(inc);
    $('sExp').textContent = fmt(exp);
    $('sBal').textContent = fmt(inc - exp);
    $('sBal').className = (inc - exp) < 0 ? 'exp' : '';

    var lim = state.limit, bar = $('bar'), txt = $('limitText');
    if (lim > 0) {
      var pct = Math.min(100, exp / lim * 100);
      bar.style.width = pct + '%';
      bar.style.background = exp > lim ? 'var(--red)' : pct >= 80 ? 'var(--amber)' : 'var(--green)';
      txt.textContent = exp > lim
        ? fmt(exp - lim) + ' over the limit of ' + fmt(lim)
        : fmt(lim - exp) + ' left of ' + fmt(lim);
    } else {
      bar.style.width = '0';
      txt.textContent = 'Set a limit to track your spending.';
    }

    $('list').innerHTML = items.length ? items.map(function (t) {
      var sign = t.type === 'income' ? '+' : '−';
      var cls = t.type === 'income' ? 'inc' : 'exp';
      return '<li><div class="meta"><b>' + esc(t.note || t.cat) + '</b><span>' + esc(t.cat) + ' · ' + esc(t.date) + '</span></div>' +
        '<div class="row"><span class="amt ' + cls + '">' + sign + fmt(t.amount) + '</span>' +
        '<button class="del" data-id="' + t.id + '" aria-label="Delete">✕</button></div></li>';
    }).join('') : '<li class="empty">No transactions this month.</li>';
  }

  function setType(t) {
    type = t;
    $('tExp').classList.toggle('on', t === 'expense');
    $('tInc').classList.toggle('on', t === 'income');
    buildCats();
  }

  $('tExp').onclick = function () { setType('expense'); };
  $('tInc').onclick = function () { setType('income'); };
  $('month').onchange = render;
  $('gear').onclick = function () { $('settings').classList.toggle('open'); };

  $('limit').oninput = function () { state.limit = parseFloat(this.value) || 0; save(); render(); };
  $('currency').oninput = function () { state.currency = this.value.trim(); save(); render(); };

  $('add').onclick = function () {
    var amt = parseFloat($('amount').value);
    var date = $('date').value || todayStr();
    if (!(amt > 0)) { $('amount').focus(); return; }
    state.tx.push({ id: Date.now(), type: type, amount: amt, date: date, cat: $('cat').value, note: $('note').value.trim() });
    save();
    $('amount').value = ''; $('note').value = '';
    buildMonths(); $('month').value = date.slice(0, 7);
    render();
  };

  $('list').onclick = function (e) {
    var b = e.target.closest('.del');
    if (!b) return;
    var id = +b.getAttribute('data-id');
    state.tx = state.tx.filter(function (t) { return t.id !== id; });
    save(); render();
  };

  $('export').onclick = function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'budget-tracker-data.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };

  $('clear').onclick = function () {
    if (confirm('Delete all transactions and settings? This cannot be undone.')) {
      state = { tx: [], limit: 0, currency: '' };
      save(); init();
    }
  };

  function init() {
    $('date').value = todayStr();
    $('limit').value = state.limit || '';
    $('currency').value = state.currency;
    buildMonths();
    $('month').value = todayStr().slice(0, 7);
    setType('expense');
    render();
  }

  load();
  init();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
