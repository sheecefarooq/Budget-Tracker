<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Tracker</title>
<meta name="theme-color" content="#1a0f3c">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* ===== COLOURS: change these three to change the default theme ===== */
  :root {
    --bg1: #1a0f3c;      /* background gradient, top-left */
    --bg2: #3b1a5a;      /* background gradient, bottom-right */
    --accent: #7c5cff;   /* buttons, active tab, chart bars */
    --on-accent: #ffffff;
    /* ================================================================== */
    --card: rgba(255,255,255,.06); --border: rgba(255,255,255,.12);
    --text: #f1ecff; --muted: #b3a6d9;
    --green: #4ade80; --red: #f87171; --amber: #facc15;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 1.5rem; margin: 0; }
  .row { display: flex; gap: 8px; align-items: center; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 1rem; font-weight: 500; color: var(--muted); }
  select, input, button { font: inherit; color: var(--text); }
  select, input[type=text], input[type=number], input[type=date], input:not([type]) {
    background: rgba(0,0,0,.25); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; width: 100%; min-width: 0;
  }
  input::placeholder { color: rgba(179,166,217,.6); }
  button { cursor: pointer; border: 1px solid var(--border); background: rgba(0,0,0,.25); border-radius: 12px; padding: 12px 14px; }
  .icon-btn { font-size: 1.2rem; line-height: 1; }
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .summary-grid small { display: block; color: var(--muted); margin-bottom: 4px; }
  .summary-grid strong { font-size: 1.3rem; }
  .inc { color: var(--green); } .exp { color: var(--red); }
  .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin: 12px 0 8px; }
  .bar > div { height: 100%; width: 0; border-radius: 99px; background: var(--green); transition: width .3s, background .3s; }
  .hint { color: var(--muted); font-size: .9rem; }
  .center { text-align: center; margin-top: 10px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .primary { width: 100%; background: var(--accent); color: var(--on-accent); border: 0; font-weight: 600; }
  .ghost { width: 100%; margin-top: 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  li:last-child { border-bottom: 0; }
  li .meta { min-width: 0; }
  li .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .meta span { color: var(--muted); font-size: .85rem; }
  li .amt { font-weight: 600; white-space: nowrap; }
  li button { padding: 6px 10px; }
  .empty { color: var(--muted); text-align: center; padding: 12px 0; }
  #settings { display: none; }
  #settings.open { display: block; }
  .settings-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .danger { color: var(--red); }
  .label { color: var(--muted); font-size: .85rem; margin: 14px 0 6px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 44px; height: 44px; border-radius: 50%; padding: 0; border: 2px solid var(--border); }
  .colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .colors label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
  .colors input[type=color] { width: 100%; height: 42px; padding: 2px; background: rgba(0,0,0,.25); border: 1px solid var(--border); border-radius: 10px; }
  .cat-row { margin-bottom: 10px; }
  .cat-row .top { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 4px; }
  .cat-row .track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .cat-row .fill { height: 100%; border-radius: 99px; background: var(--accent); }
  .filters { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-bottom: 6px; }
  #file { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>💰 Budget Tracker</h1>
    <div class="row">
      <select id="month" aria-label="Month"></select>
      <button class="icon-btn" id="gear" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <section class="card" id="settings">
    <h2>Settings</h2>
    <input id="currency" placeholder="Currency symbol (optional, e.g. Rs, $, €)" maxlength="4">

    <div class="label">Theme</div>
    <div class="swatches" id="swatches"></div>

    <div class="label">Custom colours</div>
    <div class="colors">
      <label>Background 1<input type="color" id="cBg1"></label>
      <label>Background 2<input type="color" id="cBg2"></label>
      <label>Accent<input type="color" id="cAcc"></label>
    </div>

    <div class="settings-actions">
      <button id="exportJson">Export data (JSON backup)</button>
      <button id="exportCsv">Export CSV (for Excel)</button>
      <button id="importBtn">Import backup (JSON)</button>
      <input type="file" id="file" accept="application/json,.json">
      <button id="clear" class="danger">Delete all data</button>
    </div>
  </section>

  <section class="card">
    <div class="summary-grid">
      <div><small>Income</small><strong class="inc" id="sInc">0</strong></div>
      <div><small>Spent</small><strong class="exp" id="sExp">0</strong></div>
      <div><small>Balance</small><strong id="sBal">0</strong></div>
    </div>
    <div class="hint center" id="vsLast"></div>
  </section>

  <section class="card">
    <h2>Monthly spending limit</h2>
    <input id="limit" type="number" inputmode="decimal" min="0" placeholder="0">
    <div class="bar"><div id="bar"></div></div>
    <div class="hint" id="limitText">Set a limit to track your spending.</div>
  </section>

  <section class="card">
    <h2 id="formTitle">Add transaction</h2>
    <div class="seg">
      <button id="tExp" class="on" type="button">Expense</button>
      <button id="tInc" type="button">Income</button>
    </div>
    <div class="grid2">
      <input id="amount" type="number" inputmode="decimal" min="0" step="any" placeholder="Amount">
      <input id="date" type="date">
    </div>
    <div class="grid2">
      <select id="cat"></select>
      <input id="note" placeholder="Note (optional)" maxlength="60">
    </div>
    <button class="primary" id="add" type="button">Add</button>
    <button class="ghost" id="cancel" type="button" style="display:none">Cancel edit</button>
  </section>

  <section class="card" id="breakdownCard">
    <h2>Spending by category</h2>
    <div id="breakdown"></div>
  </section>

  <section class="card">
    <h2>Transactions</h2>
    <div class="filters">
      <input id="search" placeholder="Search…">
      <select id="typeFilter">
        <option value="all">All</option>
        <option value="expense">Expenses</option>
        <option value="income">Income</option>
      </select>
    </div>
    <ul id="list"></ul>
  </section>

</div>

<script>
(function () {
  var KEY = 'budgetTracker.v1';
  var EXP_CATS = ['Food', 'Transport', 'Bills', 'Shopping', 'Health', 'Entertainment', 'Other'];
  var INC_CATS = ['Salary', 'Business', 'Gift', 'Other'];
  var THEMES = [
    { name: 'Purple', bg1: '#1a0f3c', bg2: '#3b1a5a', accent: '#7c5cff' },
    { name: 'Ocean',  bg1: '#07203a', bg2: '#0d4a6b', accent: '#22b8cf' },
    { name: 'Forest', bg1: '#0b2a1f', bg2: '#1c5a3f', accent: '#34d399' },
    { name: 'Sunset', bg1: '#3b0f1d', bg2: '#8a3a2a', accent: '#f97316' },
    { name: 'Black',  bg1: '#000000', bg2: '#14141a', accent: '#a78bfa' }
  ];
  var state = { tx: [], limit: 0, currency: '', theme: { bg1: THEMES[0].bg1, bg2: THEMES[0].bg2, accent: THEMES[0].accent } };
  var type = 'expense';
  var editingId = null;
  var $ = function (id) { return document.getElementById(id); };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        state.tx = Array.isArray(s.tx) ? s.tx : [];
        state.limit = s.limit || 0;
        state.currency = s.currency || '';
        if (s.theme && s.theme.bg1 && s.theme.bg2 && s.theme.accent) state.theme = s.theme;
      }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmt(n) {
    var s = Math.round(n).toLocaleString('en-US');
    return state.currency ? state.currency + ' ' + s : s;
  }
  function monthLabel(ym) {
    var p = ym.split('-');
    return new Date(+p[0], +p[1] - 1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
  }
  function prevMonth(ym) {
    var p = ym.split('-'), d = new Date(+p[0], +p[1] - 2, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------- Theme ---------- */
  function onAccent(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? '#000000' : '#ffffff';
  }
  function applyTheme() {
    var t = state.theme, r = document.documentElement.style;
    r.setProperty('--bg1', t.bg1);
    r.setProperty('--bg2', t.bg2);
    r.setProperty('--accent', t.accent);
    r.setProperty('--on-accent', onAccent(t.accent));
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.setAttribute('content', t.bg1);
    $('cBg1').value = t.bg1; $('cBg2').value = t.bg2; $('cAcc').value = t.accent;
  }
  function buildSwatches() {
    $('swatches').innerHTML = THEMES.map(function (t, i) {
      return '<button class="sw" data-i="' + i + '" title="' + t.name + '" aria-label="' + t.name +
        '" style="background:linear-gradient(135deg,' + t.bg1 + ' 0%,' + t.accent + ' 100%)"></button>';
    }).join('');
  }

  /* ---------- Month / category setup ---------- */
  function buildMonths() {
    var sel = $('month'), cur = sel.value || todayStr().slice(0, 7);
    var set = {}, now = new Date();
    for (var i = -12; i <= 3; i++) {
      var d = new Date(now.getFullYear(), now.getMonth() + i, 1);
      set[d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')] = 1;
    }
    state.tx.forEach(function (t) { set[t.date.slice(0, 7)] = 1; });
    var keys = Object.keys(set).sort();
    sel.innerHTML = keys.map(function (k) { return '<option value="' + k + '">' + monthLabel(k) + '</option>'; }).join('');
    sel.value = set[cur] ? cur : todayStr().slice(0, 7);
  }
  function buildCats(selected) {
    var cats = type === 'expense' ? EXP_CATS : INC_CATS;
    if (selected && cats.indexOf(selected) === -1) cats = cats.concat([selected]);
    $('cat').innerHTML = cats.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
    if (selected) $('cat').value = selected;
  }

  /* ---------- Render ---------- */
  function sumFor(ym, t) {
    return state.tx.reduce(function (a, x) { return a + (x.date.slice(0, 7) === ym && x.type === t ? x.amount : 0); }, 0);
  }

  function render() {
    var ym = $('month').value;
    var all = state.tx.filter(function (t) { return t.date.slice(0, 7) === ym; });
    var inc = 0, exp = 0, byCat = {};
    all.forEach(function (t) {
      if (t.type === 'income') inc += t.amount;
      else { exp += t.amount; byCat[t.cat] = (byCat[t.cat] || 0) + t.amount; }
    });

    $('sInc').textContent = fmt(inc);
    $('sExp').textContent = fmt(exp);
    $('sBal').textContent = fmt(inc - exp);
    $('sBal').className = (inc - exp) < 0 ? 'exp' : '';

    var prev = sumFor(prevMonth(ym), 'expense');
    if (prev > 0) {
      var diff = (exp - prev) / prev * 100;
      $('vsLast').textContent = Math.abs(Math.round(diff)) === 0
        ? 'Spending is the same as last month'
        : 'Spent ' + Math.abs(Math.round(diff)) + '% ' + (diff > 0 ? 'more' : 'less') + ' than last month';
    } else { $('vsLast').textContent = ''; }

    var lim = state.limit, bar = $('bar'), txt = $('limitText');
    if (lim > 0) {
      var pct = Math.min(100, exp / lim * 100);
      bar.style.width = pct + '%';
      bar.style.background = exp > lim ? 'var(--red)' : pct >= 80 ? 'var(--amber)' : 'var(--green)';
      txt.textContent = exp > lim
        ? fmt(exp - lim) + ' over the limit of ' + fmt(lim)
        : fmt(lim - exp) + ' left of ' + fmt(lim);
    } else {
      bar.style.width = '0';
      txt.textContent = 'Set a limit to track your spending.';
    }

    // category breakdown
    var cats = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });
    $('breakdown').innerHTML = cats.length ? cats.map(function (c) {
      var p = exp > 0 ? byCat[c] / exp * 100 : 0;
      return '<div class="cat-row"><div class="top"><span>' + esc(c) + '</span><span>' + fmt(byCat[c]) + ' · ' + Math.round(p) + '%</span></div>' +
        '<div class="track"><div class="fill" style="width:' + p + '%"></div></div></div>';
    }).join('') : '<div class="empty">No expenses this month.</div>';

    // list with filters
    var q = $('search').value.trim().toLowerCase(), tf = $('typeFilter').value;
    var items = all.filter(function (t) {
      if (tf !== 'all' && t.type !== tf) return false;
      if (!q) return true;
      return (t.note + ' ' + t.cat).toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return b.date.localeCompare(a.date) || b.id - a.id; });

    $('list').innerHTML = items.length ? items.map(function (t) {
      var sign = t.type === 'income' ? '+' : '−';
      var cls = t.type === 'income' ? 'inc' : 'exp';
      return '<li><div class="meta"><b>' + esc(t.note || t.cat) + '</b><span>' + esc(t.cat) + ' · ' + esc(t.date) + '</span></div>' +
        '<div class="row"><span class="amt ' + cls + '">' + sign + fmt(t.amount) + '</span>' +
        '<button data-edit="' + t.id + '" aria-label="Edit">✎</button>' +
        '<button data-del="' + t.id + '" aria-label="Delete">✕</button></div></li>';
    }).join('') : '<li class="empty">No transactions found.</li>';
  }

  /* ---------- Form ---------- */
  function setType(t, keepCat) {
    type = t;
    $('tExp').classList.toggle('on', t === 'expense');
    $('tInc').classList.toggle('on', t === 'income');
    buildCats(keepCat);
  }
  function resetForm() {
    editingId = null;
    $('amount').value = ''; $('note').value = ''; $('date').value = todayStr();
    $('formTitle').textContent = 'Add transaction';
    $('add').textContent = 'Add';
    $('cancel').style.display = 'none';
    setType(type);
  }
  function startEdit(id) {
    var t = state.tx.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    editingId = id;
    setType(t.type, t.cat);
    $('amount').value = t.amount;
    $('date').value = t.date;
    $('note').value = t.note || '';
    $('formTitle').textContent = 'Edit transaction';
    $('add').textContent = 'Save changes';
    $('cancel').style.display = 'block';
    $('amount').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  $('tExp').onclick = function () { setType('expense'); };
  $('tInc').onclick = function () { setType('income'); };
  $('month').onchange = render;
  $('search').oninput = render;
  $('typeFilter').onchange = render;
  $('gear').onclick = function () { $('settings').classList.toggle('open'); };

  $('limit').oninput = function () { state.limit = parseFloat(this.value) || 0; save(); render(); };
  $('currency').oninput = function () { state.currency = this.value.trim(); save(); render(); };

  $('add').onclick = function () {
    var amt = parseFloat($('amount').value);
    var date = $('date').value || todayStr();
    if (!(amt > 0)) { $('amount').focus(); return; }
    var rec = { type: type, amount: amt, date: date, cat: $('cat').value, note: $('note').value.trim() };
    if (editingId) {
      state.tx = state.tx.map(function (t) { return t.id === editingId ? Object.assign({ id: editingId }, rec) : t; });
    } else {
      rec.id = Date.now();
      state.tx.push(rec);
    }
    save();
    resetForm();
    buildMonths(); $('month').value = date.slice(0, 7);
    render();
  };
  $('cancel').onclick = resetForm;

  $('list').onclick = function (e) {
    var ed = e.target.closest('[data-edit]');
    if (ed) { startEdit(+ed.getAttribute('data-edit')); return; }
    var del = e.target.closest('[data-del]');
    if (del && confirm('Delete this transaction?')) {
      var id = +del.getAttribute('data-del');
      state.tx = state.tx.filter(function (t) { return t.id !== id; });
      if (editingId === id) resetForm();
      save(); render();
    }
  };

  /* ---------- Theme events ---------- */
  $('swatches').onclick = function (e) {
    var b = e.target.closest('.sw');
    if (!b) return;
    var t = THEMES[+b.getAttribute('data-i')];
    state.theme = { bg1: t.bg1, bg2: t.bg2, accent: t.accent };
    save(); applyTheme();
  };
  $('cBg1').oninput = function () { state.theme.bg1 = this.value; save(); applyTheme(); };
  $('cBg2').oninput = function () { state.theme.bg2 = this.value; save(); applyTheme(); };
  $('cAcc').oninput = function () { state.theme.accent = this.value; save(); applyTheme(); };

  /* ---------- Export / import ---------- */
  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  $('exportJson').onclick = function () {
    download('budget-tracker-backup.json', JSON.stringify(state, null, 2), 'application/json');
  };
  $('exportCsv').onclick = function () {
    var q = function (s) { return '"' + String(s).replace(/"/g, '""') + '"'; };
    var rows = ['Date,Type,Category,Note,Amount'].concat(
      state.tx.slice().sort(function (a, b) { return a.date.localeCompare(b.date); })
        .map(function (t) { return [t.date, t.type, q(t.cat), q(t.note || ''), t.amount].join(','); })
    );
    download('budget-tracker.csv', rows.join('\n'), 'text/csv');
  };
  $('importBtn').onclick = function () { $('file').click(); };
  $('file').onchange = function () {
    var f = this.files[0], input = this;
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var s = JSON.parse(rd.result);
        if (!s || !Array.isArray(s.tx)) throw new Error('bad');
        if (!confirm('Replace your current data with this backup (' + s.tx.length + ' transactions)?')) return;
        state.tx = s.tx.filter(function (t) { return t && t.date && t.amount > 0 && (t.type === 'income' || t.type === 'expense'); })
          .map(function (t, i) { return { id: t.id || Date.now() + i, type: t.type, amount: +t.amount, date: String(t.date), cat: t.cat || 'Other', note: t.note || '' }; });
        state.limit = s.limit || 0;
        state.currency = s.currency || '';
        if (s.theme && s.theme.bg1 && s.theme.bg2 && s.theme.accent) state.theme = s.theme;
        save(); init();
      } catch (e) { alert('That file is not a valid backup.'); }
      input.value = '';
    };
    rd.readAsText(f);
  };
  $('clear').onclick = function () {
    if (confirm('Delete all transactions and settings? This cannot be undone.')) {
      state = { tx: [], limit: 0, currency: '', theme: { bg1: THEMES[0].bg1, bg2: THEMES[0].bg2, accent: THEMES[0].accent } };
      save(); init();
    }
  };

  function init() {
    $('limit').value = state.limit || '';
    $('currency').value = state.currency;
    buildSwatches();
    applyTheme();
    buildMonths();
    $('month').value = todayStr().slice(0, 7);
    type = 'expense';
    resetForm();
    render();
  }

  load();
  init();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
